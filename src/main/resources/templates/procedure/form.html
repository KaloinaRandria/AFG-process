<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${form.id == null} ? 'Nouvelle procédure' : 'Modifier la procédure'">Procédure</title>
    <th:block th:insert="~{fragment/load_css :: load_css}"></th:block>
    <th:block th:insert="~{fragment/font :: font}"></th:block>
    <th:block th:insert="~{fragment/load_script :: load_script}"></th:block>
</head>
<body>
<div th:replace="~{fragment/sidebar :: sidebar}"></div>
<div class="main-content">
    <section>
        <div th:replace="~{fragment/load_pop_up :: pop_up}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 page-actions gap-2">
            <h1>
                <i class="fas fa-book"></i>
                <span th:text="${form.id == null} ? 'Nouvelle procédure' : 'Modifier la procédure'"></span>
            </h1>
            <a th:href="${form.id == null} ? @{/procedure/list} : @{/procedure/{id}(id=${form.id})}"
               class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Retour</a>
        </div>

        <div class="alert alert-warning" th:if="${#lists.isEmpty(directions)}">
            <i class="fas fa-exclamation-triangle"></i>
            Aucune direction n'est enregistrée : <a th:href="@{/direction/list}">créez d'abord les directions</a>.
        </div>

        <form th:action="@{/procedure/save}" th:object="${form}" method="post" enctype="multipart/form-data"
              data-chargement="Enregistrement…">
            <input type="hidden" th:field="*{id}"/>
            <div class="card" style="max-width: 900px">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label" for="reference">Référence *</label>
                            <input type="text" class="form-control" th:field="*{reference}" maxlength="50" required
                                   placeholder="ex. PRO-DSI-004">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="idDirection">Direction *</label>
                            <select class="form-select" th:field="*{idDirection}" required>
                                <option value="">— Choisir —</option>
                                <option th:each="d : ${directions}" th:value="${d.id}"
                                        th:text="${d.nomAffiche} + (${d.actif} ? '' : ' (inactive)')"></option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="titre">Titre *</label>
                            <input type="text" class="form-control" th:field="*{titre}" maxlength="255" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="description">Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="3" maxlength="2000"
                                      placeholder="Objet de la procédure, public concerné…"></textarea>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="fichier">
                                Document PDF <span th:text="${form.id == null} ? '*' : ''"></span>
                            </label>
                            <input type="file" class="form-control" id="fichier" name="fichier"
                                   accept="application/pdf,.pdf" th:required="${form.id == null}">
                            <div class="form-text" th:if="${form.fichierNom}">
                                Fichier actuel : <b th:text="${form.fichierNom}"></b>
                                — choisissez un fichier seulement pour le remplacer.
                            </div>
                            <div class="form-text">Le fichier est enregistré sur le serveur (50 Mo maximum).</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="seuilReussite">Note minimale pour valider *</label>
                            <div class="input-group">
                                <input type="number" class="form-control" th:field="*{seuilReussite}" min="1"
                                       th:max="${nbQuestionsQuiz}" required>
                                <span class="input-group-text">/ <span th:text="${nbQuestionsQuiz}"></span></span>
                            </div>
                            <div class="form-text">En dessous : formation requise.</div>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{actif}">
                                <label class="form-check-label" for="actif1">Procédure active (visible des collaborateurs)</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer text-end">
                    <button type="submit" class="btn btn-gradient-green px-4">
                        <i class="fas fa-save me-1"></i> Enregistrer
                    </button>
                </div>
            </div>
        </form>
    </section>
</div>
</body>
</html>
