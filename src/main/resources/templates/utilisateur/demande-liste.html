<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Demandes d'utilisateurs</title>
    <th:block th:insert="~{fragment/load_css :: load_css}"></th:block>
    <th:block th:insert="~{fragment/font :: font}"></th:block>
    <th:block th:insert="~{fragment/load_script :: load_script}"></th:block>
</head>
<body>
<div th:replace="~{fragment/sidebar :: sidebar}"></div>
<div class="main-content">
    <section>
        <div th:replace="~{fragment/load_pop_up :: pop_up}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 page-actions gap-2">
            <h1><i class="fas fa-user-check"></i> Demandes d'utilisateurs</h1>
            <a sec:authorize="hasRole('MAKER')" th:href="@{/user/add}" class="btn btn-gradient-blue">
                <i class="fas fa-user-plus me-1"></i> Demande de création
            </a>
        </div>

        <!-- En attente -->
        <div class="card mb-4">
            <div class="card-header">
                <h6 class="mb-0">En attente de validation (<span th:text="${#lists.size(enAttente)}"></span>)</h6>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(enAttente)}" class="text-muted text-center py-3">Aucune demande en attente.</div>
                <div class="table-responsive" th:unless="${#lists.isEmpty(enAttente)}">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr><th>N°</th><th>Type</th><th>Utilisateur</th><th>Rôles demandés</th><th>Saisie par</th><th>Le</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${enAttente}">
                            <td th:text="${d.id}"></td>
                            <td><span class="st-badge st-encours" th:text="${d.type.libelle}"></span></td>
                            <td>
                                <div class="fw-bold" th:text="${d.nomComplet}"></div>
                                <div class="small text-muted" th:text="${d.mail}"></div>
                            </td>
                            <td>
                                <span th:each="r : ${d.roles}" class="st-badge st-neutre me-1" th:text="${r}"></span>
                                <span th:if="${d.roles.isEmpty()}" class="text-muted small">Collaborateur</span>
                            </td>
                            <td th:text="${d.maker.nomComplet}"></td>
                            <td th:text="${#temporals.format(d.dateDemande, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-end">
                                <a th:href="@{/user/demande/{id}(id=${d.id})}" class="btn btn-sm btn-gradient-blue">
                                    <span sec:authorize="hasRole('CHECKER')">Examiner</span>
                                    <span sec:authorize="!hasRole('CHECKER')">Voir</span>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Historique : filtres multicritères et pagination côté serveur -->
        <h6 class="ui-section-title mt-2 mb-2"><span>Historique</span></h6>
        <form th:replace="~{fragment/liste :: filtres(~{::champs}, ${filtre.actif}, '')}">
            <th:block th:ref="champs">
                <div class="col-md-4 col-xl-4">
                    <label class="form-label" for="q">Utilisateur</label>
                    <input type="search" class="form-control form-control-sm" id="q" name="q" th:value="${filtre.q}"
                           placeholder="Mail, nom ou prénom…">
                </div>
                <div class="col-md-4 col-xl-2">
                    <label class="form-label" for="type">Type</label>
                    <select class="form-select form-select-sm" id="type" name="type">
                        <option value="">Tous</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t.libelle}" th:selected="${filtre.type == t}"></option>
                    </select>
                </div>
                <div class="col-md-4 col-xl-2">
                    <label class="form-label" for="statut">Statut</label>
                    <select class="form-select form-select-sm" id="statut" name="statut">
                        <option value="">Tous</option>
                        <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.libelle}" th:selected="${filtre.statut == s}"></option>
                    </select>
                </div>
            </th:block>
        </form>

        <div class="card">
            <div class="card-body p-0">
                <div th:if="${page.empty}" class="text-muted text-center py-5"
                     th:text="${filtre.actif} ? 'Aucune demande ne correspond aux filtres.' : 'Aucune demande traitée.'"></div>
                <div class="table-responsive" th:unless="${page.empty}">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th th:replace="~{fragment/liste :: tri('N°', 'id')}"></th>
                            <th th:replace="~{fragment/liste :: tri('Type', 'type')}"></th>
                            <th th:replace="~{fragment/liste :: tri('Utilisateur', 'mail')}"></th>
                            <th th:replace="~{fragment/liste :: tri('Statut', 'statut')}"></th>
                            <th>Maker</th>
                            <th>Checker</th>
                            <th th:replace="~{fragment/liste :: tri('Traitée le', 'dateTraitement')}"></th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${page.content}">
                            <td th:text="${d.id}"></td>
                            <td th:text="${d.type.libelle}"></td>
                            <td>
                                <div class="fw-bold" th:text="${d.nomComplet}"></div>
                                <div class="small text-muted" th:text="${d.mail}"></div>
                            </td>
                            <td>
                                <span class="st-badge"
                                      th:classappend="${d.statut.name() == 'VALIDEE'} ? 'st-acquis' : (${d.statut.name() == 'REJETEE'} ? 'st-formation' : 'st-neutre')"
                                      th:text="${d.statut.libelle}"></span>
                            </td>
                            <td th:text="${d.maker.nomComplet}"></td>
                            <td th:text="${d.checker != null} ? ${d.checker.nomComplet} : '—'"></td>
                            <td th:text="${#temporals.format(d.dateTraitement, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-end">
                                <a th:href="@{/user/demande/{id}(id=${d.id})}" class="btn btn-sm btn-outline-secondary"
                                   title="Voir la demande"><i class="fas fa-eye"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div th:replace="~{fragment/liste :: pagination(${page})}"></div>
        </div>
    </section>
</div>
</body>
</html>
