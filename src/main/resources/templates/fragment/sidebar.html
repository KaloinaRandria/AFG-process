<!-- fragment/sidebar.html -->
<div th:fragment="sidebar"
     id="sidebar"
     class="d-flex flex-column flex-shrink-0 vh-100 position-fixed border-end"
     style="background-color: #0A1A44; overflow-y: auto;" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- État du menu appliqué avant l'affichage (pas de saut de mise en page) : replié sur ordinateur -->
    <script>
        try {
            if (localStorage.getItem("sidebarReduit") === "1") document.documentElement.classList.add("sidebar-reduit");
        } catch (e) { /* stockage indisponible : menu déplié */ }
    </script>

    <!-- LOGO + bouton replier (ordinateur) / fermer (mobile) -->
    <div class="sidebar-entete border-bottom mb-4">
        <a th:href="@{/}"
           class="sidebar-logo d-flex align-items-center justify-content-center text-decoration-none py-4">
            <img th:src="@{/img/logo_afg.png}" alt="Logo" height="60">
        </a>
        <button type="button" class="sidebar-bascule" id="sidebarBascule"
                title="Replier / déplier le menu" aria-label="Replier ou déplier le menu">
            <i class="fas fa-angle-double-left"></i>
        </button>
    </div>

    <!-- TITRE DU MODULE -->
    <div class="sidebar-titre text-white text-center fw-bold mb-3" style="font-size: 15px; letter-spacing: 1px;">
        FORMATIONS &amp; PROCÉDURES
    </div>

    <!-- MENU -->
    <div class="px-3 mb-2">
        <a class="nav-link text-white d-flex align-items-center sidebar-link"
           th:href="@{/}"
           th:classappend="${currentUri == '/' ? 'active' : ''}">
            <i class="fas fa-home me-3"></i> Accueil
        </a>
    </div>

    <div class="accordion accordion-flush px-2" id="sidebarAccordion">

        <!-- ═══════════════════ PROCÉDURES ═══════════════════ -->
        <div class="sidebar-groupe-menu">
        <div class="sidebar-categorie"><span>Procédures</span></div>

        <div class="accordion-item bg-transparent border-0">
            <h2 class="accordion-header">
                <button class="accordion-button bg-transparent text-start text-white sidebar-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseProcedure"
                        aria-expanded="false"
                        aria-controls="collapseProcedure"
                        th:classappend="${currentUri.startsWith('/procedure') ? '' : 'collapsed'}">
                    <i class="fas fa-book me-3"></i> Procédures
                </button>
            </h2>
            <div id="collapseProcedure"
                 class="accordion-collapse collapse"
                 data-bs-parent="#sidebarAccordion"
                 th:classappend="${currentUri.startsWith('/procedure') ? 'show' : ''}">
                <div class="accordion-body p-0">
                    <ul class="nav flex-column px-3">
                        <li>
                            <a class="nav-link text-white sidebar-sub"
                               th:href="@{/procedure/list}"
                               th:classappend="${currentUri == '/procedure/list' ? 'active' : ''}">
                                <i class="fas fa-list me-2"></i> Liste des procédures
                            </a>
                        </li>
                        <li sec:authorize="hasAnyRole('ADMIN')">
                            <a class="nav-link text-white sidebar-sub"
                               th:href="@{/procedure/add}"
                               th:classappend="${currentUri == '/procedure/add' ? 'active' : ''}">
                                <i class="fas fa-plus me-2"></i> Nouvelle procédure
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        </div>

        <!-- ═══════════════════ ÉVALUATIONS ═══════════════════ -->
        <div class="sidebar-groupe-menu">
        <div class="sidebar-categorie"><span>Évaluations</span></div>

        <div class="accordion-item bg-transparent border-0">
            <h2 class="accordion-header">
                <button class="accordion-button bg-transparent text-start text-white sidebar-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseEvaluation"
                        aria-expanded="false"
                        aria-controls="collapseEvaluation"
                        th:classappend="${currentUri.startsWith('/evaluation') ? '' : 'collapsed'}">
                    <i class="fas fa-clipboard-check me-3"></i> Quiz &amp; résultats
                </button>
            </h2>
            <div id="collapseEvaluation"
                 class="accordion-collapse collapse"
                 data-bs-parent="#sidebarAccordion"
                 th:classappend="${currentUri.startsWith('/evaluation') ? 'show' : ''}">
                <div class="accordion-body p-0">
                    <ul class="nav flex-column px-3">
                        <li>
                            <a class="nav-link text-white sidebar-sub"
                               th:href="@{/evaluation/mes-evaluations}"
                               th:classappend="${currentUri == '/evaluation/mes-evaluations' ? 'active' : ''}">
                                <i class="fas fa-history me-2"></i> Mes évaluations
                            </a>
                        </li>
                        <li sec:authorize="hasAnyRole('ADMIN')">
                            <a class="nav-link text-white sidebar-sub"
                               th:href="@{/evaluation/suivi}"
                               th:classappend="${currentUri == '/evaluation/suivi' ? 'active' : ''}">
                                <i class="fas fa-user-graduate me-2"></i> Suivi &amp; formations requises
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        </div>

        <!-- ═══════════════════ ADMINISTRATION ═══════════════════ -->
        <div class="sidebar-groupe-menu" sec:authorize="hasAnyRole('ADMIN')">
        <div class="sidebar-categorie"><span>Administration</span></div>

        <div class="accordion-item bg-transparent border-0">
            <h2 class="accordion-header">
                <button class="accordion-button bg-transparent text-start text-white sidebar-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseUtilisateur"
                        aria-expanded="false"
                        aria-controls="collapseUtilisateur"
                        th:classappend="${currentUri.startsWith('/user') ? '' : 'collapsed'}">
                    <i class="fas fa-users-cog me-3"></i> Utilisateurs &amp; directions
                </button>
            </h2>
            <div id="collapseUtilisateur"
                 class="accordion-collapse collapse"
                 data-bs-parent="#sidebarAccordion"
                 th:classappend="${currentUri.startsWith('/user') or currentUri.startsWith('/direction') ? 'show' : ''}">
                <div class="accordion-body p-0">
                    <ul class="nav flex-column px-3">
                        <li>
                            <a class="nav-link text-white sidebar-sub"
                               th:href="@{/user/add}"
                               th:classappend="${currentUri == '/user/add' ? 'active' : ''}">
                                <i class="fas fa-user-plus me-2"></i> Insérer un utilisateur
                            </a>
                        </li>
                        <li>
                            <a class="nav-link text-white sidebar-sub"
                               th:href="@{/user/list}"
                               th:classappend="${currentUri == '/user/list' ? 'active' : ''}">
                                <i class="fas fa-list me-2"></i> Liste des utilisateurs
                            </a>
                        </li>
                        <li>
                            <a class="nav-link text-white sidebar-sub"
                               th:href="@{/direction/list}"
                               th:classappend="${currentUri == '/direction/list' ? 'active' : ''}">
                                <i class="fas fa-sitemap me-2"></i> Directions
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        </div>
    </div>

    <div class="dropdown mt-auto p-3 border-top">
        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" id="dropdownUser"
           data-bs-toggle="dropdown" aria-expanded="false">
            <img th:src="@{/img/avatar.png}" alt="Avatar" width="40" height="40" class="rounded-circle me-2">
            <strong style="max-width: 200px; display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                    class="sidebar-utilisateur-nom text-white"
                    th:text="${#authentication.principal.nomComplet}"></strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-end text-small shadow" aria-labelledby="dropdownUser">
            <li>
                <!-- Déconnexion en POST (exigé par la protection CSRF) -->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="dropdown-item">Déconnexion</button>
                </form>
            </li>
        </ul>
    </div>

    <!-- Menu dynamique : replier (ordinateur, mémorisé) / ouvrir-fermer (mobile) -->
    <script>
        (function () {
            const html = document.documentElement;
            const sidebar = document.getElementById("sidebar");
            const mobile = () => window.matchMedia("(max-width: 768px)").matches;

            // Bouton ☰ et voile hors du menu : un élément fixe dans un parent déplacé (transform) le suivrait
            const burger = document.createElement("button");
            burger.type = "button";
            burger.className = "sidebar-burger";
            burger.setAttribute("aria-label", "Ouvrir le menu");
            burger.innerHTML = '<i class="fas fa-bars"></i>';
            const voile = document.createElement("div");
            voile.className = "sidebar-voile";
            document.body.append(burger, voile);

            const ouvrir = () => html.classList.add("sidebar-ouvert");
            const fermer = () => html.classList.remove("sidebar-ouvert");
            burger.addEventListener("click", ouvrir);
            voile.addEventListener("click", fermer);
            document.addEventListener("keydown", e => { if (e.key === "Escape") fermer(); });

            document.getElementById("sidebarBascule").addEventListener("click", () => {
                if (mobile()) { fermer(); return; }
                const reduit = html.classList.toggle("sidebar-reduit");
                try { localStorage.setItem("sidebarReduit", reduit ? "1" : "0"); } catch (e) { /* non mémorisé */ }
                // Les tableaux (DataTables) recalculent leur largeur
                setTimeout(() => window.dispatchEvent(new Event("resize")), 220);
            });

            // Pas de défilement horizontal : en se rétrécissant, le menu garderait le bouton
            // (qui a le focus) en vue en décalant son contenu, malgré overflow-x: hidden
            sidebar.addEventListener("scroll", () => { if (sidebar.scrollLeft !== 0) sidebar.scrollLeft = 0; });

            // Mobile : un lien choisi ferme le menu
            sidebar.addEventListener("click", e => {
                if (mobile() && e.target.closest("a[href]:not(.dropdown-toggle)")) fermer();
            });
            window.addEventListener("resize", () => { if (!mobile()) fermer(); });
        })();

        // ── Loader de navigation : barre en haut dès qu'on change de page, badge si ça tarde ──
        (function () {
            const html = document.documentElement;
            const barre = document.createElement("div");
            barre.className = "nav-loader-barre";
            const badge = document.createElement("div");
            badge.className = "nav-loader-badge";
            badge.setAttribute("role", "status");
            badge.innerHTML = '<span class="spinner-border" aria-hidden="true"></span><span>Chargement…</span>';
            document.body.append(barre, badge);

            let minuteurBadge = null, minuteurSecurite = null;
            function demarrer() {
                html.classList.add("nav-en-cours");
                clearTimeout(minuteurBadge);
                clearTimeout(minuteurSecurite);
                minuteurBadge = setTimeout(() => html.classList.add("nav-lente"), 400);
                // Sécurité : si la page ne change pas (téléchargement, réponse vide…), on retire le loader
                minuteurSecurite = setTimeout(arreter, 10000);
            }
            function arreter() {
                clearTimeout(minuteurBadge);
                clearTimeout(minuteurSecurite);
                html.classList.remove("nav-en-cours", "nav-lente");
            }
            // Retour arrière (page restaurée depuis le cache du navigateur) : pas de loader resté affiché
            window.addEventListener("pageshow", arreter);

            // Départ de la page, quelle qu'en soit l'origine : lien, formulaire, ou navigation par
            // script (lignes cliquables des listes, graphiques de l'accueil…). Annulé ou ouvert
            // dans un autre onglet, rien ne se déclenche.
            let ignorerDepart = false;
            window.addEventListener("beforeunload", () => { if (!ignorerDepart) demarrer(); });

            // Téléchargements (pièces jointes, attribut download, data-sans-loader) : le navigateur
            // signale aussi un départ, mais la page reste affichée → pas de loader
            document.addEventListener("click", e => {
                const a = e.target.closest("a[href]");
                if (!a) return;
                let chemin = "";
                try { chemin = new URL(a.href, location.href).pathname; } catch (err) { /* lien invalide */ }
                if (a.hasAttribute("download") || a.hasAttribute("data-sans-loader")
                        || /\/download(\/|$)|\/files\//.test(chemin)) {
                    ignorerDepart = true;
                    setTimeout(() => { ignorerDepart = false; }, 1500);
                }
            }, true);
        })();
    </script>

</div>
