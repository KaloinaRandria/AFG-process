<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Directions</title>
    <th:block th:insert="~{fragment/load_css :: load_css}"></th:block>
    <th:block th:insert="~{fragment/font :: font}"></th:block>
    <th:block th:insert="~{fragment/load_script :: load_script}"></th:block>
</head>
<body>
<div th:replace="~{fragment/sidebar :: sidebar}"></div>
<div class="main-content">
    <section>
        <div th:replace="~{fragment/load_pop_up :: pop_up}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 page-actions gap-2">
            <h1><i class="fas fa-sitemap"></i> Directions</h1>
        </div>

        <div class="row g-3">
            <div class="col-xl-4">
                <form id="formDirection" th:action="@{/direction/save}" method="post" data-chargement="Enregistrement…">
                    <input type="hidden" name="id" id="dirId">
                    <div class="card">
                        <div class="card-header"><h6 class="mb-0" id="dirTitre">Nouvelle direction</h6></div>
                        <div class="card-body">
                            <label class="form-label" for="dirCode">Code *</label>
                            <input type="text" class="form-control mb-3" name="code" id="dirCode" maxlength="20" required
                                   placeholder="ex. DSI">
                            <label class="form-label" for="dirLibelle">Libellé *</label>
                            <input type="text" class="form-control mb-3" name="libelle" id="dirLibelle" maxlength="255" required
                                   placeholder="ex. Direction des Systèmes d'Information">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="actif" value="true" id="dirActif" checked>
                                <label class="form-check-label" for="dirActif">Active</label>
                            </div>
                        </div>
                        <div class="card-footer d-flex justify-content-between">
                            <button type="button" class="btn btn-outline-secondary d-none" id="dirAnnuler">Annuler</button>
                            <span></span>
                            <button type="submit" class="btn btn-gradient-green px-4"><i class="fas fa-save me-1"></i> Enregistrer</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-xl-8">
                <div class="card">
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(directions)}" class="text-muted text-center py-4">Aucune direction.</div>
                        <table class="table table-hover align-middle mb-0" th:unless="${#lists.isEmpty(directions)}">
                            <thead>
                            <tr><th>Code</th><th>Libellé</th><th>Procédures</th><th>Statut</th><th></th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="d : ${directions}">
                                <td class="fw-bold" th:text="${d.code}"></td>
                                <td th:text="${d.libelle}"></td>
                                <td th:text="${nbProcedures[d.id]}"></td>
                                <td>
                                    <span class="st-badge" th:classappend="${d.actif} ? 'st-acquis' : 'st-neutre'"
                                          th:text="${d.actif} ? 'Active' : 'Inactive'"></span>
                                </td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-secondary btn-modifier"
                                            th:attr="data-id=${d.id},data-code=${d.code},data-libelle=${d.libelle},data-actif=${d.actif}"
                                            title="Modifier"><i class="fas fa-pen"></i></button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<script>
    (function () {
        const $ = id => document.getElementById(id);
        const reinit = () => {
            $('formDirection').reset();
            $('dirId').value = '';
            $('dirTitre').textContent = 'Nouvelle direction';
            $('dirAnnuler').classList.add('d-none');
        };
        document.querySelectorAll('.btn-modifier').forEach(b => b.addEventListener('click', () => {
            $('dirId').value = b.dataset.id;
            $('dirCode').value = b.dataset.code;
            $('dirLibelle').value = b.dataset.libelle;
            $('dirActif').checked = b.dataset.actif === 'true';
            $('dirTitre').textContent = 'Modifier la direction ' + b.dataset.code;
            $('dirAnnuler').classList.remove('d-none');
            $('dirCode').focus();
        }));
        $('dirAnnuler').addEventListener('click', reinit);
    })();
</script>
</body>
</html>
