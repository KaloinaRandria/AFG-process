<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mes évaluations</title>
    <th:block th:insert="~{fragment/load_css :: load_css}"></th:block>
    <th:block th:insert="~{fragment/font :: font}"></th:block>
    <th:block th:insert="~{fragment/load_script :: load_script}"></th:block>
</head>
<body>
<div th:replace="~{fragment/sidebar :: sidebar}"></div>
<div class="main-content">
    <section>
        <div th:replace="~{fragment/load_pop_up :: pop_up}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 page-actions gap-2">
            <h1><i class="fas fa-history"></i> Mes évaluations</h1>
            <a th:href="@{/procedure/list}" class="btn btn-gradient-blue"><i class="fas fa-book me-1"></i> Procédures</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(evaluations)}" class="text-muted text-center py-4">
                    Vous n'avez encore passé aucun quiz.
                    <a th:href="@{/procedure/list}">Choisir une procédure</a>.
                </div>
                <div class="table-responsive" th:unless="${#lists.isEmpty(evaluations)}">
                    <table id="tableEvaluations" class="table table-hover align-middle w-100">
                        <thead>
                        <tr>
                            <th>Date</th>
                            <th>Procédure</th>
                            <th>Direction</th>
                            <th>Note</th>
                            <th>Résultat</th>
                            <th class="text-end">Détail</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="e : ${evaluations}">
                            <td th:attr="data-order=${#temporals.format(e.dateFin, 'yyyyMMddHHmmss')}"
                                th:text="${#temporals.format(e.dateFin, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <div class="pr-ref" th:text="${e.procedure.reference}"></div>
                                <span class="pr-titre" th:text="${e.procedure.titre}"></span>
                            </td>
                            <td th:text="${e.procedure.direction.code}"></td>
                            <td th:attr="data-order=${e.note}"><b th:text="${e.note}"></b> / <span th:text="${e.nbQuestions}"></span></td>
                            <td>
                                <span class="st-badge" th:classappend="${e.formationRequise} ? 'st-formation' : 'st-acquis'"
                                      th:text="${e.resultat.libelle}"></span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/evaluation/{id}/resultat(id=${e.id})}" class="btn btn-sm btn-outline-secondary">
                                    <i class="fas fa-eye"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</div>
<script>
    $(function () {
        $('#tableEvaluations').DataTable({
            language: {url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/fr-FR.json'},
            order: [ [0, 'desc'] ],
            columnDefs: [{targets: -1, orderable: false}]
        });
    });
</script>
</body>
</html>
