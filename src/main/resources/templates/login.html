<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FORMATIONS &amp; PROCÉDURES - LOGIN</title>
    <th:block th:insert="~{fragment/load_css :: load_css}"></th:block>
    <th:block th:insert="~{fragment/font :: font}"></th:block>
    <th:block th:insert="~{fragment/load_script :: load_script}"></th:block>
</head>
<body>
<div class="vh-100 d-flex justify-content-center align-items-center">
    <div class="container">
        <div class="row d-flex justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card bg-white" style="border-radius: 15px">
                    <div class="card-body p-5" style="background-color: #001051; border-radius: 15px">
                        <img th:src="@{/img/logo_afg_email.png}" alt="AFG Bank" class="d-block mx-auto">
                        <form class="mb-3 mt-md-4" th:action="@{/login}" method="post">
                            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" th:text="${errorMessage}"></div>
                            <div th:if="${infoMessage}" class="alert alert-info" role="alert" th:text="${infoMessage}"></div>
                            <div class="mb-3">
                                <label class="form-label" style="color:white" for="email"><strong>Email</strong></label>
                                <input type="text" class="form-control" id="email" name="email"
                                       placeholder="xxxxxxxx@afgbank.mg" autofocus required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" style="color:white" for="password"><strong>Mot de passe</strong></label>
                                <div class="input-group">
                                    <input type="password" class="form-control" name="password" id="password"
                                           placeholder="*******" required>
                                    <span class="input-group-text" style="cursor:pointer" onclick="togglePassword()">
                                        <i class="fa fa-eye" id="toggleIcon"></i>
                                    </span>
                                </div>
                            </div>
                            <br>
                            <div class="col-md-4 mx-auto">
                                <div class="d-grid">
                                    <button class="btn btn-success btn-sm" type="submit"><i class="fas fa-door-open"></i> Se connecter</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function togglePassword() {
        const input = document.getElementById("password");
        const icon = document.getElementById("toggleIcon");
        const visible = input.type === "password";
        input.type = visible ? "text" : "password";
        icon.classList.toggle("fa-eye", !visible);
        icon.classList.toggle("fa-eye-slash", visible);
    }
</script>
</body>
</html>
