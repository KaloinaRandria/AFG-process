spring.application.name=AFG-process
server.servlet.context-path=/AFG-process

# ── Base de données ───────────────────────────────────────────────────────────
# Base à créer sur le serveur PostgreSQL (nom à ajuster si besoin)
spring.datasource.url=jdbc:postgresql://10.25.10.151:5432/PROCESS_PREPROD
spring.datasource.username=postgres
# spring.datasource.password : voir application-secret.properties (non suivi par Git)

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.thymeleaf.cache=false

# URL publique de l'application, utilisée dans les liens des mails
app.base-url=http://10.25.10.151:8081/AFG-process

# ── Active Directory (LDAP) ───────────────────────────────────────────────────
ldap.username=intranet.mada
# ldap.password : voir application-secret.properties (non suivi par Git)
ldap.domainName=afgbank.com
ldap.serverName=10.25.10.10
ldap.searchBase=DC=afgbank,DC=com

# Même annuaire exposé à Spring LDAP (LdapTemplate), si besoin dans les services
spring.ldap.urls=ldap://${ldap.serverName}
spring.ldap.base=${ldap.searchBase}
spring.ldap.username=${ldap.username}@${ldap.domainName}
spring.ldap.password=${ldap.password}
spring.ldap.base-environment.java.naming.referral=follow

logging.level.org.springframework.security=INFO
logging.level.org.springframework.ldap=INFO

# ── Mails (Office 365) ────────────────────────────────────────────────────────
spring.mail.default-encoding=UTF-8
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Fichiers joints (procédures, supports de formation) ──────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-part-count=500
server.tomcat.max-parameter-count=10000
storage.location=./pieces

# ── Quiz ──────────────────────────────────────────────────────────────────────
# Nombre de questions tirées au hasard dans la banque de la procédure pour chaque quiz.
# La note est le nombre de bonnes réponses ; elle est comparée au seuil de la procédure.
app.quiz.nb-questions=10

spring.web.locale=fr_FR
spring.web.locale-resolver=fixed

spring.config.import=optional:classpath:application-secret.properties

# ── Valeurs de production (le profil dev les remplace : application-dev.properties) ──
# Envoi réel des mails
app.mail.enabled=true
# Connexion de test sans Active Directory : désactivée
app.auth.test-login.enabled=false
