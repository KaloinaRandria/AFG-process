<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Procédures</title>
    <th:block th:insert="~{fragment/load_css :: load_css}"></th:block>
    <th:block th:insert="~{fragment/font :: font}"></th:block>
    <th:block th:insert="~{fragment/load_script :: load_script}"></th:block>
</head>
<body>
<div th:replace="~{fragment/sidebar :: sidebar}"></div>
<div class="main-content">
    <section>
        <div th:replace="~{fragment/load_pop_up :: pop_up}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 page-actions gap-2">
            <h1><i class="fas fa-book"></i> Procédures</h1>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/procedure/add}" class="btn btn-gradient-blue">
                <i class="fas fa-plus me-1"></i> Nouvelle procédure
            </a>
        </div>

        <p class="text-muted mb-3">
            Choisissez une procédure : lisez le document puis passez le quiz de
            <b th:text="${nbQuestionsQuiz}">10</b> questions. Selon votre note, la procédure est
            <span class="st-badge st-acquis">Acquise</span> ou une
            <span class="st-badge st-formation">Formation requise</span> vous est indiquée.
        </p>

        <form th:replace="~{fragment/liste :: filtres(~{::champs}, ${filtre.actif}, '')}">
            <th:block th:ref="champs">
                <div class="col-md-4 col-xl-3">
                    <label class="form-label" for="q">Recherche</label>
                    <input type="search" class="form-control form-control-sm" id="q" name="q" th:value="${filtre.q}"
                           placeholder="Référence, titre, description…">
                </div>
                <div class="col-md-4 col-xl-3">
                    <label class="form-label" for="direction">Direction</label>
                    <select class="form-select form-select-sm" id="direction" name="direction">
                        <option value="">Toutes</option>
                        <option th:each="d : ${directions}" th:value="${d.id}" th:text="${d.nomAffiche}"
                                th:selected="${filtre.direction == d.id}"></option>
                    </select>
                </div>
                <div class="col-md-4 col-xl-2">
                    <label class="form-label" for="resultat">Mon résultat</label>
                    <select class="form-select form-select-sm" id="resultat" name="resultat">
                        <option value="">Tous</option>
                        <option value="ACQUIS" th:selected="${filtre.resultat == 'ACQUIS'}">Acquis</option>
                        <option value="FORMATION_REQUISE" th:selected="${filtre.resultat == 'FORMATION_REQUISE'}">Formation requise</option>
                        <option value="EN_COURS" th:selected="${filtre.resultat == 'EN_COURS'}">Quiz en cours</option>
                        <option value="NON_EVALUEE" th:selected="${filtre.resultat == 'NON_EVALUEE'}">Non évaluée</option>
                    </select>
                </div>
                <div class="col-md-4 col-xl-2" sec:authorize="hasRole('ADMIN')">
                    <label class="form-label" for="statut">Statut</label>
                    <select class="form-select form-select-sm" id="statut" name="statut">
                        <option value="">Toutes</option>
                        <option value="ACTIVES" th:selected="${filtre.statut == 'ACTIVES'}">Actives</option>
                        <option value="INACTIVES" th:selected="${filtre.statut == 'INACTIVES'}">Inactives</option>
                    </select>
                </div>
            </th:block>
        </form>

        <div class="card">
            <div class="card-body p-0">
                <div th:if="${page.empty}" class="text-center text-muted py-5"
                     th:text="${filtre.actif} ? 'Aucune procédure ne correspond aux filtres.' : 'Aucune procédure disponible pour le moment.'"></div>
                <div class="table-responsive" th:unless="${page.empty}">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th th:replace="~{fragment/liste :: tri('Procédure', 'reference')}"></th>
                            <th th:replace="~{fragment/liste :: tri('Direction', 'direction.code')}"></th>
                            <th sec:authorize="hasRole('ADMIN')">Questions</th>
                            <th>Mon résultat</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${page.content}" th:with="e=${derniers[p.id]}, nbq=${nbQuestions[p.id] ?: 0}"
                            th:classappend="${p.actif and p.direction.actif} ? '' : 'q-inactive'">
                            <td>
                                <div class="pr-ref" th:text="${p.reference}"></div>
                                <a class="pr-titre" th:href="@{/procedure/{id}(id=${p.id})}" th:text="${p.titre}"></a>
                                <span th:unless="${p.actif}" class="st-badge st-neutre ms-1">Inactive</span>
                                <div class="pr-desc" th:if="${p.description}"
                                     th:text="${#strings.abbreviate(p.description, 140)}"></div>
                            </td>
                            <td th:text="${p.direction.code}" th:title="${p.direction.libelle}"></td>
                            <td sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/procedure/{id}/questions(id=${p.id})}"
                                   th:class="${nbq >= nbQuestionsQuiz} ? 'text-success' : 'text-danger'"
                                   th:title="${nbq >= nbQuestionsQuiz} ? 'Quiz disponible' : 'Pas assez de questions : quiz indisponible'">
                                    <span th:text="${nbq}"></span> / <span th:text="${nbQuestionsQuiz}"></span>
                                </a>
                            </td>
                            <td>
                                <th:block th:if="${e != null}">
                                    <span class="st-badge" th:classappend="${e.formationRequise} ? 'st-formation' : 'st-acquis'">
                                        <i class="fas" th:classappend="${e.formationRequise} ? 'fa-exclamation-circle' : 'fa-check-circle'"></i>
                                        <span th:text="${e.resultat.libelle}"></span>
                                    </span>
                                    <div class="small text-muted mt-1">
                                        <span th:text="|${e.note}/${e.nbQuestions}|"></span> ·
                                        <span th:text="${#temporals.format(e.dateFin, 'dd/MM/yyyy')}"></span>
                                    </div>
                                </th:block>
                                <span th:if="${e == null and enCours.contains(p.id)}" class="st-badge st-encours">
                                    <i class="fas fa-hourglass-half"></i> Quiz en cours
                                </span>
                                <span th:if="${e == null and !enCours.contains(p.id)}" class="st-badge st-neutre">Non évaluée</span>
                            </td>
                            <td class="text-end text-nowrap">
                                <a th:href="@{/procedure/{id}(id=${p.id})}" class="btn btn-sm btn-gradient-blue">
                                    <i class="fas fa-play me-1"></i> Ouvrir
                                </a>
                                <th:block sec:authorize="hasRole('ADMIN')">
                                    <a th:href="@{/procedure/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-secondary"
                                       title="Modifier la procédure"><i class="fas fa-pen"></i></a>
                                    <a th:href="@{/procedure/{id}/questions(id=${p.id})}" class="btn btn-sm btn-outline-secondary"
                                       title="Banque de questions"><i class="fas fa-question-circle"></i></a>
                                </th:block>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div th:replace="~{fragment/liste :: pagination(${page})}"></div>
        </div>
    </section>
</div>
</body>
</html>
